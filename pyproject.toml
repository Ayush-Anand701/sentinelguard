[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelguard"
version = "0.1.0"
description = "Multi-turn prompt-injection and intent-drift detection middleware."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
